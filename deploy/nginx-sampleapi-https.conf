# Virtual host Nginx untuk SampleApi — versi HTTPS (Bagian 4.2 modul)

# Blok 1: semua trafik HTTP (port 80) dialihkan permanen ke HTTPS (port 443)
server {
    listen 80;
    server_name api.example.test;
    server_tokens off;

    return 301 https://$host$request_uri;
}

# Blok 2: terminasi TLS di port 443, lalu teruskan ke Kestrel via HTTP loopback
server {
    # Nginx 1.24 (Ubuntu 24.04) masih pakai sintaks "listen ... http2".
    # Di Nginx >= 1.25.1 ganti jadi:  listen 443 ssl;  +  http2 on;
    listen 443 ssl http2;
    server_name api.example.test;
    server_tokens off;

    ssl_certificate     /etc/ssl/localcerts/api.example.test.crt;
    ssl_certificate_key /etc/ssl/localcerts/api.example.test.key;

    # Hanya protokol TLS modern
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
