# Virtual host Nginx untuk SampleApi — versi HTTP (Bagian 3.3 modul)
# Versi HTTPS menyusul di Tahap 6.

server {
    listen 80;
    server_name api.example.test;

    # Sembunyikan versi Nginx di header "Server" & halaman error (hardening)
    server_tokens off;

    # Batas ukuran payload (default Nginx cuma 1m). Selaras dengan Kestrel 10 MiB.
    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Teruskan identitas & protokol asli client ke ASP.NET Core
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout komunikasi ke upstream Kestrel
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
